services:
  brasileirao:
    build: .
    image: brasileirao_app
    ports:
      - "8504:8504"
    # o projeto é montado como volume: uma atualização dos CSVs em app/ já é
    # lida pelo Streamlit sem precisar reconstruir a imagem
    volumes:
      - .:/app
    working_dir: /app
    command: /opt/venv/bin/streamlit run app/app.py --server.port=8504 --server.address=0.0.0.0
    restart: always
